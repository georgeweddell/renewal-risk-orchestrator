    days_ago: 150
    action_type: pricing_exception
    risk_band: critical
    risk_score: 78
    drivers: [usage_drop, open_p1, renewal_soon]
    proposal: "10% discount to hold the renewal"
    status: rejected
    approver: "Sam Reyes (Deal desk)"
    note: "Rejected: fix the P1s first. Offered an exec sponsor call and an engineering escalation instead."
    outcome: renewed
    outcome_note: "Renewed at full price after both P1s were fixed three weeks before the renewal date. Usage recovered to baseline."

  - account_slug: orion-freight
    account_name: Orion Freight
    days_ago: 210
    action_type: crm_risk_update
    risk_band: at-risk
    risk_score: 37
    drivers: [usage_drop, renewal_soon]
    proposal: "Set renewal_risk_level = at-risk; start a customer success adoption plan"
    status: approved
    approver: "Marcus Bell (Account owner)"
    outcome: renewed
    outcome_note: "Renewed flat after a six-week adoption plan brought usage back to 90% of its peak."

  # --- Summit Analytics: a mid-term discount request was rejected ------------------
  - account_slug: summit-analytics
    account_name: Summit Analytics
    days_ago: 95
    action_type: pricing_exception
