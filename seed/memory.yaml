# Past renewal decisions: the institutional memory the agent consults.
# Includes former customers (not among today's 8 accounts), because precedent
# is most useful when it comes from accounts that have already renewed or left.
# days_ago is relative to the day you seed.
#
# Drivers use the risk engine's codes: usage_drop, open_p1, open_p2, renewal_soon.

decisions:
  # --- Halcyon Robotics: last year's discount didn't fix adoption ------------------
  - account_slug: halcyon-robotics
    account_name: Halcyon Robotics
    days_ago: 372
    action_type: pricing_exception
    risk_band: at-risk
    risk_score: 51
    drivers: [usage_drop, renewal_soon]
    proposal: "15% discount on the 2025 renewal"
    status: approved
    approver: "Sam Reyes (Deal desk)"
    note: "Approved to secure the renewal after a Q2 usage dip. No adoption conditions attached."
    outcome: renewed
    outcome_note: "Renewed at 15% off, but usage started falling again within six months. The discount didn't change adoption."

  - account_slug: halcyon-robotics
    account_name: Halcyon Robotics
    days_ago: 372
    action_type: crm_risk_update
    risk_band: at-risk
    risk_score: 51
    drivers: [usage_drop, renewal_soon]
    proposal: "Set renewal_risk_level = at-risk on the 2025 renewal deal"
    status: approved
    approver: "Priya Shah (Account owner)"
    outcome: renewed

  # --- Former customers with the same profile as today's critical accounts ---------
  - account_slug: quarry-systems
    account_name: Quarry Systems
    days_ago: 240
    action_type: pricing_exception
    risk_band: critical
    risk_score: 85
    drivers: [usage_drop, open_p1, renewal_soon]
    proposal: "20% discount to offset open SSO and reporting defects"
    status: approved
    approver: "Sam Reyes (Deal desk)"
    note: "Discount offered while both P1s were still open."
    outcome: churned
    outcome_note: "Churned four months later. The exit interview cited the unresolved SSO problems, not price."

  - account_slug: larkspur-health
