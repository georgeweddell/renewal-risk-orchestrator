# Demo data: the single source of truth for every system.
#
# `rro seed` turns this into the mock systems. From Phase 3 the same file is
# pushed into HubSpot, GitHub Issues and PostHog, so mock and live demos tell
# the same story. Dates are relative to the day you seed, so the demo never
# goes stale.
#
# usage.change_pct: weekly active users, last 4 weeks vs the 8 weeks before.
# expected_band: what the deterministic risk engine should conclude (tested).

