[project]
name = "renewal-risk-orchestrator"
version = "0.1.0"
description = "An MCP-based agent that preps SaaS renewals across CRM, support, and product analytics, with governance and human approval built in."
authors = [
    { name = "George Weddell", email = "185487850+georgeweddell@users.noreply.github.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "pyyaml",
    "rich",
    "typer",
    "uvicorn>=0.54.0",
]

[project.scripts]
rro = "rro.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rro", "src/mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
