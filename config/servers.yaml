# How the Tool Gateway starts each MCP server, per backend (mock | live).
# Each system's backend comes from .env (RRO_MODE or <SYSTEM>_BACKEND).
#
# Placeholders filled in by the app:
#   {python}     the current Python interpreter
#   {mock_db}    path to the seeded mock-systems database
#   {memory_db}  path to the decision memory
#   ${NAME}      a value from .env (e.g. ${GITHUB_TOKEN}); a missing one is a clear error
#
# An entry with a top-level `command` runs the same way in every mode.
#
# `env` is the complete list of variables a server receives (on top of the
# MCP SDK's safe defaults such as PATH). Servers never inherit the
# orchestrator's environment, so each one only ever sees its own credentials:
# the usage server gets PostHog's read-only key and nothing else.

systems:
  crm:
    description: "CRM: companies, renewal deals, owners (HubSpot)"
    mock:
      command: "{python}"
      args: ["-m", "mcp_servers.crm"]
      env: {CRM_BACKEND: mock, RRO_MOCK_DB: "{mock_db}"}
    live:
      command: "{python}"
      args: ["-m", "mcp_servers.crm"]
      env: {CRM_BACKEND: hubspot, HUBSPOT_ACCESS_TOKEN: "${HUBSPOT_ACCESS_TOKEN}"}

  tickets:
    description: "Support tickets (GitHub Issues as a stand-in)"
    mock:
      command: "{python}"
      args: ["-m", "mcp_servers.tickets"]
      env: {TICKETS_BACKEND: mock, RRO_MOCK_DB: "{mock_db}"}
    live:
      command: "{python}"
      args: ["-m", "mcp_servers.tickets"]
      env: {TICKETS_BACKEND: github, GITHUB_TICKETS_REPO: "${GITHUB_TICKETS_REPO}", GITHUB_TOKEN: "${GITHUB_TOKEN}"}

  usage:
    description: "Product usage analytics (PostHog)"
    mock:
      command: "{python}"
      args: ["-m", "mcp_servers.usage"]
      env: {USAGE_BACKEND: mock, RRO_MOCK_DB: "{mock_db}"}
    live:
      command: "{python}"
      args: ["-m", "mcp_servers.usage"]
      env:
        USAGE_BACKEND: posthog
        POSTHOG_HOST: "${POSTHOG_HOST}"
        POSTHOG_PROJECT_ID: "${POSTHOG_PROJECT_ID}"
        POSTHOG_PERSONAL_API_KEY: "${POSTHOG_PERSONAL_API_KEY}"

  memory:
    description: "Past renewal decisions and outcomes (this app's own store)"
    command: "{python}"
    args: ["-m", "mcp_servers.memory"]
    env: {RRO_MEMORY_DB: "{memory_db}"}
